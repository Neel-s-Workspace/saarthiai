version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000/api
    networks:
      - saarthi-net

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/counselor_app?schema=public
      - JWT_SECRET=${JWT_SECRET:-changeme_in_production}
      - PORT=5000
    depends_on:
      - db
    networks:
      - saarthi-net

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: counselor_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saarthi-net

volumes:
  postgres_data:


networks:
  saarthi-net:
    driver: bridge
